[project]
name = "posta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "google-genai>=1.46.0",
    "jwcrypto>=1.5.6",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
    "services",
    "uvicorn>=0.41.0",
]

[project.scripts]
posta = "posta.app:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
services = { workspace = true }
