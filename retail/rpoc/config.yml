main :
  path : 
    csv : assets/data/data4.csv
    ordering-lists : assets/jsons/ordering_lists.json
    purchases : assets/jsons/purchases.json
    checkpoint : 
    po-file : assets/jsons/po.json
    save : assets/files

  prompts : 
    ingestion : assets/prompts/ingestion.md
    review : assets/prompts/review.md
    coder : assets/prompts/coder.md
    chain-rules : assets/prompts/chain_rules.md

  columns :
    - Code
    - Product Name
    - Packing Size
    - Pack Price
    - Pack Price Currency
    - GST
    - Supplier
    - Other
    - TMG Selling Price
    - TMG Promotion Price

  update-cols : 
    - Packing Size
    - Pack Price
    - Pack Price Currency
    - GST
    - TMG Selling Price
    - TMG Promotion Price
  tabs : []

master-list :
  header : Master List
  upload-file :
    label : Upload Price List
    type : 
      - xlsx
      - xls
      - csv
      - pdf
      - png
      - jpg
    accept_multiple_files : true
    key : master_upload

  col-hdr : Current Master List
  col-btn :
    label : Refresh
    use_container_width : true
    help : Reload master list

  empty-df-info :
    label : No data yet. Upload supplier Excel files above to populate the master list.
  
  df-allowed-cols : []
  df :
    use_container_width : true
    hide_index : true

chatbot :
  message-pdf-download :
    label : Download PDF
    
  coder-model :
    model : llama-3.3-70b-versatile
    temperature : 0

  rev-model :
    model : llama-3.3-70b-versatile
    temperature : 0

ordering-lists :
  file-uploader :
    label : Upload PO Images
    type : 
      - jpg
      - png
      - jpeg
    accept_multiple_files : true

  manual-list-name :
    label : Ordering List Name
    placeholder : e.g. Weekly Order
    key : manual_list_name

  selected-products :
    label : Select Products
    key : manual_products