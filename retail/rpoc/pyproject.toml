[project]
name = "rpoc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ayush SInghal", email = "ayushsinghal1510@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docx2txt>=0.9",
    "fastexcel>=0.19.0",
    "fpdf>=1.7.2",
    "google-generativeai>=0.8.6",
    "groq>=1.1.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "polars>=1.40.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.55.0",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
rpoc = "rpoc:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
